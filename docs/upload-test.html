<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片上传测试 - Elysia Learning</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .section {
      margin-bottom: 40px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    .form-group input[type="file"] {
      display: block;
      width: 100%;
      padding: 12px;
      border: 2px dashed #ddd;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    .form-group input[type="file"]:hover {
      border-color: #667eea;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }

    .result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }

    .info-box {
      background: #e7f3ff;
      border: 1px solid #b3d9ff;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .info-box h3 {
      color: #0066cc;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .info-box ul {
      color: #333;
      margin-left: 20px;
      line-height: 1.8;
    }

    .preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .preview-item {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .preview-item:hover {
      transform: scale(1.05);
    }

    .preview-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .preview-item .info {
      padding: 10px;
      font-size: 12px;
      color: #666;
    }

    .preview-item .info .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-card .label {
      color: #666;
      font-size: 14px;
    }

    .tips {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .tips h3 {
      color: #856404;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .tips p {
      color: #856404;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 图片上传测试</h1>
    <p class="subtitle">Elysia.js 图片上传服务 - 支持单张和批量上传</p>

    <div class="info-box">
      <h3>⚙️ 上传配置</h3>
      <ul>
        <li>允许格式：JPEG, PNG, GIF, WebP</li>
        <li>单文件大小限制：5MB</li>
        <li>批量上传最多：10 张图片</li>
        <li>服务端地址：<code>http://localhost:3007</code></li>
      </ul>
    </div>

    <div class="tips">
      <h3>💡 使用提示</h3>
      <p>
        1. 单张上传：选择一张图片，点击"上传"按钮<br>
        2. 批量上传：按住 Ctrl/Cmd 键选择多张图片，或直接拖拽多张图片到选择框<br>
        3. 上传结果会显示在下方，包括文件信息和访问 URL
      </p>
    </div>

    <!-- 单张上传 -->
    <div class="section">
      <h2>📤 单张上传</h2>
      <div class="form-group">
        <label for="singleFile">选择一张图片：</label>
        <input type="file" id="singleFile" accept="image/jpeg,image/png,image/gif,image/webp">
      </div>
      <button class="btn" onclick="uploadSingle()">上传单张图片</button>
      <div id="singleResult"></div>
    </div>

    <!-- 批量上传 -->
    <div class="section">
      <h2>📤 批量上传</h2>
      <div class="form-group">
        <label for="batchFiles">选择多张图片（最多 10 张）：</label>
        <input type="file" id="batchFiles" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
      </div>
      <button class="btn" onclick="uploadBatch()">批量上传</button>
      <div id="batchResult"></div>
      <div id="batchPreview" class="preview"></div>
    </div>

    <!-- 文件列表 -->
    <div class="section">
      <h2>📁 文件列表</h2>
      <button class="btn" onclick="loadFiles()" style="margin-bottom: 15px;">刷新列表</button>
      <div id="fileList"></div>
    </div>

    <!-- 统计信息 -->
    <div class="section">
      <h2>📊 统计信息</h2>
      <button class="btn" onclick="loadStats()" style="margin-bottom: 15px;">刷新统计</button>
      <div id="stats" class="stats"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3007';

    // 单张上传
    async function uploadSingle() {
      const fileInput = document.getElementById('singleFile');
      const resultDiv = document.getElementById('singleResult');

      if (!fileInput.files[0]) {
        resultDiv.innerHTML = '<div class="result error">请选择一张图片</div>';
        return;
      }

      const formData = new FormData();
      formData.append('image', fileInput.files[0]);

      resultDiv.innerHTML = '<div class="result"><span class="loading"></span>正在上传...</div>';

      try {
        const response = await fetch(`${API_BASE}/upload`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.success) {
          resultDiv.innerHTML = `
            <div class="result success">
              <strong>✅ 上传成功!</strong>
              <br><br>
              <strong>文件名:</strong> ${data.data.originalName}<br>
              <strong>保存名:</strong> ${data.data.filename}<br>
              <strong>类型:</strong> ${data.data.mimetype}<br>
              <strong>大小:</strong> ${formatFileSize(data.data.size)}<br>
              <strong>URL:</strong> <a href="${API_BASE}${data.data.url}" target="_blank">${API_BASE}${data.data.url}</a><br>
              <strong>上传时间:</strong> ${new Date(data.data.uploadedAt).toLocaleString()}
            </div>
          `;
        } else {
          resultDiv.innerHTML = `<div class="result error">❌ 上传失败：${data.message}</div>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<div class="result error">❌ 上传失败：${error.message}</div>`;
      }
    }

    // 批量上传
    async function uploadBatch() {
      const fileInput = document.getElementById('batchFiles');
      const resultDiv = document.getElementById('batchResult');
      const previewDiv = document.getElementById('batchPreview');

      if (!fileInput.files || fileInput.files.length === 0) {
        resultDiv.innerHTML = '<div class="result error">请选择至少一张图片</div>';
        return;
      }

      if (fileInput.files.length > 10) {
        resultDiv.innerHTML = `<div class="result error">最多只能上传 10 张图片，当前选择了 ${fileInput.files.length} 张</div>`;
        return;
      }

      const formData = new FormData();
      for (let i = 0; i < fileInput.files.length; i++) {
        formData.append('images', fileInput.files[i]);
      }

      resultDiv.innerHTML = '<div class="result"><span class="loading"></span>正在批量上传...</div>';
      previewDiv.innerHTML = '';

      try {
        const response = await fetch(`${API_BASE}/upload/batch`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.success) {
          let html = `<div class="result success"><strong>✅ 上传成功!</strong><br><br>`;
          html += `<strong>总数:</strong> ${data.data.total} 张<br>`;
          html += `<strong>成功:</strong> ${data.data.successCount} 张<br>`;
          if (data.errors && data.errors.length > 0) {
            html += `<strong>失败:</strong> ${data.errors.length} 张<br>`;
          }
          html += `</div>`;

          // 显示预览
          const previewHtml = data.data.uploaded.map(file => `
            <div class="preview-item">
              <img src="${API_BASE}${file.url}" alt="${file.originalName}">
              <div class="info">
                <div class="name" title="${file.originalName}">${file.originalName}</div>
                <div>${formatFileSize(file.size)}</div>
              </div>
            </div>
          `).join('');

          previewDiv.innerHTML = previewHtml;
          resultDiv.innerHTML = html;
        } else {
          resultDiv.innerHTML = `<div class="result error">❌ 上传失败：${data.message}</div>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<div class="result error">❌ 上传失败：${error.message}</div>`;
      }
    }

    // 加载文件列表
    async function loadFiles() {
      const listDiv = document.getElementById('fileList');
      listDiv.innerHTML = '<div class="result"><span class="loading"></span>正在加载...</div>';

      try {
        const response = await fetch(`${API_BASE}/files?page=1&limit=20`);
        const data = await response.json();

        if (data.success) {
          if (data.data.files.length === 0) {
            listDiv.innerHTML = '<div class="result">暂无文件</div>';
            return;
          }

          let html = '<div class="preview">';
          data.data.files.forEach(file => {
            html += `
              <div class="preview-item">
                <img src="${API_BASE}${file.url}" alt="${file.originalName}">
                <div class="info">
                  <div class="name" title="${file.originalName}">${file.originalName}</div>
                  <div>${formatFileSize(file.size)}</div>
                  <div style="font-size: 11px; color: #999;">${new Date(file.uploadedAt).toLocaleDateString()}</div>
                </div>
              </div>
            `;
          });
          html += '</div>';

          html += `
            <div style="margin-top: 15px; text-align: center; color: #666;">
              第 ${data.data.pagination.page} / ${data.data.pagination.totalPages} 页，
              共 ${data.data.pagination.total} 个文件
            </div>
          `;

          listDiv.innerHTML = html;
        } else {
          listDiv.innerHTML = `<div class="result error">加载失败：${data.message}</div>`;
        }
      } catch (error) {
        listDiv.innerHTML = `<div class="result error">加载失败：${error.message}</div>`;
      }
    }

    // 加载统计信息
    async function loadStats() {
      const statsDiv = document.getElementById('stats');
      statsDiv.innerHTML = '<div class="result"><span class="loading"></span>正在加载...</div>';

      try {
        const response = await fetch(`${API_BASE}/stats`);
        const data = await response.json();

        if (data.success) {
          statsDiv.innerHTML = `
            <div class="stat-card">
              <div class="value">${data.data.totalFiles}</div>
              <div class="label">总文件数</div>
            </div>
            <div class="stat-card">
              <div class="value">${data.data.totalSizeFormatted}</div>
              <div class="label">总大小</div>
            </div>
            <div class="stat-card">
              <div class="value">${data.data.byType.length}</div>
              <div class="label">文件类型</div>
            </div>
          `;

          if (data.data.byType.length > 0) {
            const typeHtml = `
              <div class="stat-card" style="grid-column: 1 / -1;">
                <h3 style="margin-bottom: 10px; color: #333;">按类型统计</h3>
                ${data.data.byType.map(t => `
                  <div style="display: inline-block; margin-right: 20px; padding: 8px 15px; background: #f0f0f0; border-radius: 4px; margin-bottom: 10px;">
                    <strong style="color: #667eea; text-transform: uppercase;">${t.type}</strong>: 
                    ${t.count} 个，${t.size}
                  </div>
                `).join('')}
              </div>
            `;
            statsDiv.innerHTML += typeHtml;
          }
        } else {
          statsDiv.innerHTML = `<div class="result error">加载失败：${data.message}</div>`;
        }
      } catch (error) {
        statsDiv.innerHTML = `<div class="result error">加载失败：${error.message}</div>`;
      }
    }

    // 格式化文件大小
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // 页面加载时自动加载数据
    window.onload = function() {
      loadFiles();
      loadStats();
    };
  </script>
</body>
</html>
