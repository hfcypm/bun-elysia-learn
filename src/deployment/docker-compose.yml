version: '3.8'

# Docker Compose 配置说明
# 用于编排 Elysia.js 应用及其依赖服务

services:
  # Elysia.js 应用
  app:
    build:
      context: .
      dockerfile: src/deployment/Dockerfile
    container_name: elysia-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 运行环境
      - NODE_ENV=production
      - PORT=3000
      
      # 数据库配置 (SQLite)
      - DATABASE_URL=file:./data/prod.db
      
      # JWT 配置
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      
      # 日志配置
      - LOG_LEVEL=info
    
    # 挂载数据卷 (持久化)
    volumes:
      - app-data:/app/data
      - ./logs:/app/logs
    
    # 健康检查
    healthcheck:
      test: ["CMD", "bun", "run", "src/deployment/03-health-check.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # 网络配置
    networks:
      - elysia-network
    
    # 依赖服务
    depends_on:
      - redis
  
  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: elysia-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - elysia-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # PostgreSQL 数据库 (可选，如需使用 PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: elysia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elysia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elysia-password}
      POSTGRES_DB: ${POSTGRES_DB:-elysia_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # 开发环境暴露，生产环境建议不暴露
    networks:
      - elysia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Nginx 反向代理 (可选，用于生产环境)
  nginx:
    image: nginx:alpine
    container_name: elysia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src/deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro # SSL 证书
    depends_on:
      - app
    networks:
      - elysia-network
    profiles:
      - production # 仅在生产环境启动

# 数据卷定义
volumes:
  app-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local

# 网络定义
networks:
  elysia-network:
    driver: bridge

# ==================== 使用说明 ====================
#
# 启动所有服务:
# docker-compose up -d
#
# 启动部分服务 (不启动 nginx):
# docker-compose up -d app redis
#
# 查看日志:
# docker-compose logs -f app
#
# 停止所有服务:
# docker-compose down
#
# 停止并删除数据卷:
# docker-compose down -v
#
# 重新构建:
# docker-compose build --no-cache
#
# 进入应用容器:
# docker-compose exec app /bin/bash
#
# 查看服务状态:
# docker-compose ps
#
# 只启动生产环境配置:
# docker-compose --profile production up -d
#
# ==================== 环境变量配置文件 (.env) ====================
#
# 复制 .env.example 到 .env 并修改:
# cp .env.example .env
