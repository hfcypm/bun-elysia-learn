<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件上传测试 - Tailwind CSS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-6xl mx-auto px-4">
    <!-- 标题 -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">📷 文件上传测试</h1>
      <p class="text-gray-600">后端服务：http://localhost:3007</p>
    </div>

    <!-- 上传配置信息 -->
    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-8">
      <h3 class="font-semibold text-blue-900 mb-2">📋 上传限制</h3>
      <ul class="text-sm text-blue-800 space-y-1">
        <li>• 支持的格式：JPEG, PNG, GIF, WebP</li>
        <li>• 单文件大小：最大 5MB</li>
        <li>• 批量上传：最多 10 个文件</li>
      </ul>
    </div>

    <!-- 单文件上传 -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold text-gray-900 mb-4">📄 单文件上传</h2>
      
      <div class="space-y-4">
        <input
          id="singleFileInput"
          type="file"
          accept="image/*"
          class="hidden"
        />

        <div class="flex gap-4">
          <button
            onclick="document.getElementById('singleFileInput').click()"
            class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors"
          >
            📁 选择文件
          </button>
          <button
            id="singleUploadBtn"
            onclick="handleSingleUpload()"
            disabled
            class="px-6 py-2 rounded-lg transition-colors bg-gray-300 cursor-not-allowed"
          >
            ⬆️ 上传
          </button>
        </div>

        <!-- 文件预览 -->
        <div id="singlePreview" class="hidden mt-4 p-4 bg-gray-50 rounded-lg">
          <p class="text-sm font-medium text-gray-700 mb-2">预览：</p>
          <img id="previewImage" class="max-w-sm max-h-64 rounded-lg shadow-sm" />
          <div class="mt-3 space-y-1 text-sm text-gray-600">
            <p>文件名：<span id="previewName" class="font-mono"></span></p>
            <p>大小：<span id="previewSize" class="font-mono"></span></p>
            <p>类型：<span id="previewType" class="font-mono"></span></p>
          </div>
        </div>
      </div>
    </div>

    <!-- 批量上传 -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold text-gray-900 mb-4">
        📦 批量上传
        <span class="text-sm font-normal text-gray-500 ml-2">(最多 10 个文件)</span>
      </h2>
      
      <div class="space-y-4">
        <input
          id="batchFileInput"
          type="file"
          accept="image/*"
          multiple
          class="hidden"
        />

        <div class="flex gap-4">
          <button
            onclick="document.getElementById('batchFileInput').click()"
            class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors"
          >
            📁 选择多个文件
          </button>
          <button
            id="batchUploadBtn"
            onclick="handleBatchUpload()"
            disabled
            class="px-6 py-2 rounded-lg transition-colors bg-gray-300 cursor-not-allowed"
          >
            ⬆️ 批量上传
          </button>
        </div>

        <!-- 已选文件列表 -->
        <div id="batchPreview" class="hidden mt-4 p-4 bg-gray-50 rounded-lg">
          <p class="text-sm font-medium text-gray-700 mb-2">
            已选择 <span id="batchCount"></span> 个文件：
          </p>
          <ul id="batchFileList" class="space-y-1"></ul>
        </div>
      </div>
    </div>

    <!-- 错误提示 -->
    <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-800 rounded-lg p-4 mb-6">
      ❌ <span id="errorMessage"></span>
    </div>

    <!-- 上传结果 -->
    <div id="resultBox" class="hidden rounded-lg p-4 mb-6">
      <p id="resultMessage" class="font-medium"></p>
      <p id="resultDetail" class="text-sm mt-2"></p>
    </div>

    <!-- 文件列表 -->
    <div class="bg-white rounded-lg shadow-md p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold text-gray-900">📋 已上传文件</h2>
        <button
          onclick="fetchFileList()"
          class="px-4 py-2 text-sm bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors"
        >
          🔄 刷新
        </button>
      </div>

      <div id="fileList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- 文件列表将在这里渲染 -->
      </div>

      <!-- 统计信息 -->
      <div id="fileStats" class="hidden mt-6 pt-4 border-t border-gray-200">
        <p class="text-sm text-gray-600">共 <span id="fileCount"></span> 个文件</p>
      </div>
    </div>

    <!-- 底部说明 -->
    <div class="mt-8 text-center text-sm text-gray-500">
      <p>💡 提示：上传的文件保存在 /workspace/uploads/ 目录</p>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3007'
    let selectedFile = null
    let selectedBatchFiles = []

    // 格式化文件大小
    function formatSize(bytes) {
      if (bytes === 0) return '0 B'
      const k = 1024
      const sizes = ['B', 'KB', 'MB', 'GB']
      const i = Math.floor(Math.log(bytes) / Math.log(k))
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i]
    }

    // 格式化日期
    function formatDate(dateString) {
      const date = new Date(dateString)
      return date.toLocaleString('zh-CN')
    }

    // 显示错误
    function showError(message) {
      document.getElementById('errorBox').classList.remove('hidden')
      document.getElementById('errorMessage').textContent = message
      setTimeout(() => {
        document.getElementById('errorBox').classList.add('hidden')
      }, 5000)
    }

    // 显示结果
    function showResult(success, message, detail = '') {
      const box = document.getElementById('resultBox')
      const msg = document.getElementById('resultMessage')
      const detailEl = document.getElementById('resultDetail')
      
      box.classList.remove('hidden')
      box.className = success 
        ? 'bg-green-50 border border-green-200 rounded-lg p-4 mb-6'
        : 'bg-red-50 border border-red-200 rounded-lg p-4 mb-6'
      
      msg.className = success ? 'font-medium text-green-900' : 'font-medium text-red-900'
      msg.textContent = (success ? '✅ ' : '❌ ') + message
      detailEl.textContent = detail
      detailEl.className = success ? 'text-sm text-green-800 mt-2' : 'text-sm text-red-800 mt-2'
    }

    // 单文件选择
    document.getElementById('singleFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0]
      if (file) {
        selectedFile = file
        const url = URL.createObjectURL(file)
        
        document.getElementById('previewImage').src = url
        document.getElementById('previewName').textContent = file.name
        document.getElementById('previewSize').textContent = formatSize(file.size)
        document.getElementById('previewType').textContent = file.type
        document.getElementById('singlePreview').classList.remove('hidden')
        
        const btn = document.getElementById('singleUploadBtn')
        btn.disabled = false
        btn.className = 'px-6 py-2 rounded-lg transition-colors bg-green-600 text-white hover:bg-green-700'
      }
    })

    // 批量文件选择
    document.getElementById('batchFileInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files)
      if (files.length > 0) {
        selectedBatchFiles = files
        document.getElementById('batchCount').textContent = files.length
        
        const list = document.getElementById('batchFileList')
        list.innerHTML = files.map(f => 
          `<li class="text-sm text-gray-600 flex justify-between">
            <span class="font-mono">${f.name}</span>
            <span>${formatSize(f.size)}</span>
          </li>`
        ).join('')
        
        document.getElementById('batchPreview').classList.remove('hidden')
        
        const btn = document.getElementById('batchUploadBtn')
        btn.disabled = false
        btn.className = 'px-6 py-2 rounded-lg transition-colors bg-green-600 text-white hover:bg-green-700'
      }
    })

    // 单文件上传
    async function handleSingleUpload() {
      if (!selectedFile) return
      
      const btn = document.getElementById('singleUploadBtn')
      btn.disabled = true
      btn.textContent = '上传中...'
      
      const formData = new FormData()
      formData.append('image', selectedFile)
      
      try {
        const res = await fetch(`${API_BASE}/upload`, {
          method: 'POST',
          body: formData
        })
        const data = await res.json()
        
        if (data.success) {
          showResult(true, data.message, `文件：${data.data.originalName}`)
          selectedFile = null
          document.getElementById('singleFileInput').value = ''
          document.getElementById('singlePreview').classList.add('hidden')
          btn.disabled = true
          btn.className = 'px-6 py-2 rounded-lg transition-colors bg-gray-300 cursor-not-allowed'
          fetchFileList()
        } else {
          showError(data.message)
        }
      } catch (err) {
        showError('上传失败：' + err.message)
      } finally {
        btn.disabled = false
        btn.textContent = '⬆️ 上传'
      }
    }

    // 批量上传
    async function handleBatchUpload() {
      if (selectedBatchFiles.length === 0) return
      
      const btn = document.getElementById('batchUploadBtn')
      btn.disabled = true
      btn.textContent = '上传中...'
      
      const formData = new FormData()
      selectedBatchFiles.forEach(file => formData.append('images', file))
      
      try {
        const res = await fetch(`${API_BASE}/upload/batch`, {
          method: 'POST',
          body: formData
        })
        const data = await res.json()
        
        if (data.success) {
          showResult(true, data.message, `成功上传 ${data.data.uploaded.length} 个文件`)
          selectedBatchFiles = []
          document.getElementById('batchFileInput').value = ''
          document.getElementById('batchPreview').classList.add('hidden')
          btn.disabled = true
          btn.className = 'px-6 py-2 rounded-lg transition-colors bg-gray-300 cursor-not-allowed'
          fetchFileList()
        } else {
          showError(data.message)
        }
      } catch (err) {
        showError('上传失败：' + err.message)
      } finally {
        btn.disabled = false
        btn.textContent = '⬆️ 批量上传'
      }
    }

    // 获取文件列表
    async function fetchFileList() {
      try {
        const res = await fetch(`${API_BASE}/files`)
        const data = await res.json()
        
        const listEl = document.getElementById('fileList')
        const statsEl = document.getElementById('fileStats')
        const countEl = document.getElementById('fileCount')
        
        if (data.success && data.data.files.length > 0) {
          listEl.innerHTML = data.data.files.map(file => `
            <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
              <div class="aspect-square bg-gray-100 rounded-lg mb-3 overflow-hidden">
                <img 
                  src="${API_BASE}${file.url}" 
                  alt="${file.originalName}"
                  class="w-full h-full object-cover"
                  onerror="this.src='data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100\" height=\"100\"><rect fill=\"%23f0f0f0\" width=\"100\" height=\"100\"/><text x=\"50%\" y=\"50%\" text-anchor=\"middle\" fill=\"%23999\">无预览</text></svg>'"
                />
              </div>
              <div class="space-y-1 text-sm">
                <p class="font-medium text-gray-900 truncate" title="${file.originalName}">
                  ${file.originalName}
                </p>
                <p class="text-gray-500">${formatSize(file.size)}</p>
                <p class="text-gray-500 text-xs">${(file.mimetype.split('/')[1] || '').toUpperCase()}</p>
                <p class="text-gray-400 text-xs">${formatDate(file.uploadedAt)}</p>
              </div>
              <div class="mt-3 flex gap-2">
                <a
                  href="${API_BASE}${file.url}"
                  target="_blank"
                  class="flex-1 px-3 py-1.5 text-xs bg-indigo-600 text-white rounded hover:bg-indigo-700 transition-colors text-center"
                >
                  🔗 查看
                </a>
                <button
                  onclick="handleDelete('${file.id}', '${file.originalName}')"
                  class="px-3 py-1.5 text-xs bg-red-600 text-white rounded hover:bg-red-700 transition-colors"
                >
                  🗑️ 删除
                </button>
              </div>
            </div>
          `).join('')
          
          countEl.textContent = data.data.files.length
          statsEl.classList.remove('hidden')
        } else {
          listEl.innerHTML = '<p class="text-gray-500 text-center py-8">暂无文件，点击上方按钮上传</p>'
          statsEl.classList.add('hidden')
        }
      } catch (err) {
        showError('获取文件列表失败：' + err.message)
      }
    }

    // 删除文件
    async function handleDelete(fileId, filename) {
      if (!confirm(`确定要删除文件 "${filename}" 吗？`)) return
      
      try {
        const res = await fetch(`${API_BASE}/files/${fileId}`, {
          method: 'DELETE'
        })
        const data = await res.json()
        
        if (data.success) {
          showResult(true, `已删除文件：${filename}`)
          fetchFileList()
        } else {
          showError(data.message)
        }
      } catch (err) {
        showError('删除失败：' + err.message)
      }
    }

    // 页面加载时获取文件列表
    fetchFileList()
  </script>
</body>
</html>
